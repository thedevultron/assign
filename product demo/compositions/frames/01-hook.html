<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Roboto Mono';
          src: local('Consolas'), local('Courier New'), local('monospace');
        }
        @font-face {
          font-family: 'Newsreader';
          src: local('Georgia'), local('Times New Roman'), local('serif');
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #090a0b;
          color: #f5f5f7;
          font-family: "Inter", -apple-system, system-ui, sans-serif;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .bg-glow {
          position: absolute;
          width: 1000px;
          height: 1000px;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(132, 125, 255, 0.16) 0%, rgba(0, 179, 221, 0.05) 50%, transparent 75%);
          border-radius: 50%;
          pointer-events: none;
        }
        .content-box {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 40px;
        }
        .section-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.14);
          padding: 8px 20px;
          border-radius: 9999px;
          font-family: "Roboto Mono", monospace;
          font-size: 13.5px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #c8c8cc;
          margin-bottom: 24px;
        }
        .section-badge .dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #847dff;
          box-shadow: 0 0 10px #847dff;
        }
        .serif-title {
          font-family: "Newsreader", Georgia, serif;
          font-weight: 300;
          font-size: 84px;
          line-height: 1.08;
          letter-spacing: -0.025em;
          color: #f5f5f7;
          max-width: 1200px;
        }
        .serif-title em {
          font-style: italic;
          color: #ffffff;
        }
        .subhead {
          font-size: 24px;
          color: #c8c8cc;
          font-weight: 400;
          max-width: 860px;
          margin-top: 20px;
          line-height: 1.5;
        }
        .brand-logo-wrap {
          display: flex;
          align-items: center;
          gap: 24px;
          margin-bottom: 24px;
        }
        .logo-text {
          font-size: 78px;
          font-weight: 700;
          letter-spacing: -0.04em;
          color: #ffffff;
        }
      </style>

      <div id="root" data-composition-id="frame-01" data-width="1920" data-height="1080">
        <div class="bg-glow" id="f1-glow"></div>

        <!-- Part A: Problem Slam -->
        <div id="f1-slam" class="content-box">
          <div class="section-badge"><span class="dot"></span>Problem Statement</div>
          <h1 class="serif-title">
            Stop pasting tasks into <em>chat windows.</em>
          </h1>
          <p class="subhead">Juggling tabs, losing progress, and race conditions between coding agents.</p>
        </div>

        <!-- Part B: Brand Reveal -->
        <div id="f1-brand" class="content-box" style="position: absolute; opacity: 0;">
          <div class="brand-logo-wrap">
            <svg width="96" height="96" viewBox="0 0 32 32" fill="none">
              <rect x="0.5" y="0.5" width="31" height="31" rx="8" fill="#ffffff" />
              <rect x="7" y="8" width="5" height="16" rx="1.5" fill="#0f1011" />
              <rect x="13.5" y="8" width="5" height="10" rx="1.5" fill="#0f1011" />
              <rect x="20" y="8" width="5" height="6" rx="1.5" fill="#847dff" />
            </svg>
            <span class="logo-text">assign</span>
          </div>
          <h2 class="serif-title" style="font-size: 72px;">
            The board your agents <em>work from.</em>
          </h2>
          <div class="section-badge" style="margin-top: 28px; border-color: #847dff; color: #d1c9ff;">
            <span class="dot"></span>Model Context Protocol · 8 Tools Supported
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        // Problem statement entrance
        tl.fromTo("#f1-slam", 
          { scale: 0.9, opacity: 0 }, 
          { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 
          0.1
        );
        // Problem exits
        tl.to("#f1-slam", 
          { scale: 1.05, opacity: 0, duration: 0.5, ease: "power2.in" }, 
          1.7
        );
        // Brand pops in
        tl.fromTo("#f1-brand", 
          { scale: 0.88, opacity: 0, y: 30 }, 
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.4)" }, 
          2.1
        );
        // Ambient glow breathe
        tl.to("#f1-glow", 
          { scale: 1.2, duration: 2.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 
          1.0
        );
        window.__timelines["frame-01"] = tl;
      </script>
    </template>
  </body>
</html>

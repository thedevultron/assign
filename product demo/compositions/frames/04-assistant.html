      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f4-chat-pane", 
          { x: -50, opacity: 0 }, 
          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 
          0.1
        );
        tl.fromTo("#f4-voice-pane",

          { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },

        tl.fromTo("#f4-chip", 
          { scale: 0.85, opacity: 0 },

          1.5

        // Voice orb pulsating harmonic wave
        tl.fromTo("#f4-orb", 
          { scale: 0.9 }, 
          { scale: 1.15, duration: 1.2, yoyo: true, repeat: 3, ease: "sine.inOut" }, 
          0.5
        );
        tl.fromTo("#f4-ring", 
          { rotation: 0 }, 
          { rotation: 360, duration: 4.0, ease: "linear" }, 
          0.5
        );
        window.__timelines["frame-04"] = tl;

            <div id="f3-card-stream" class="k-card">

        <div class="live-feed-bar">

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f3-board", 
          { scale: 0.94, opacity: 0 }, 
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 
          0.1
        );
        // Progress fill animation
        tl.fromTo("#f3-progress-bar", 
          { width: "20%" }, 
          { width: "75%", duration: 2.0, ease: "power1.inOut" }, 
          0.8
        );
        // Number counter on progress percentage
        const pProxy = { val: 25 };
        tl.to(pProxy, {
          val: 75,
          duration: 2.0,
          ease: "power1.inOut",
          onUpdate: () => {
            const el = document.getElementById("f3-percent-num");
            if (el) el.textContent = Math.round(pProxy.val) + "%";
          }
        }, 0.8);

        // Highlight review card arrival
        tl.fromTo("#f3-review-card", 
          { scale: 1 }, 
          { scale: 1.03, borderColor: "#847dff", duration: 0.4, yoyo: true, repeat: 1 }, 
          2.4
        );
        window.__timelines["frame-03"] = tl;
      </script>

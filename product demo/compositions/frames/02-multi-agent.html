<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Roboto Mono';
          src: local('Consolas'), local('Courier New'), local('monospace');
        }
        @font-face {
          font-family: 'Newsreader';
          src: local('Georgia'), local('Times New Roman'), local('serif');
        }
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #090a0b;
          color: #f5f5f7;
          font-family: "Inter", -apple-system, system-ui, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 60px 120px;
        }
        .section-badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.14);
          padding: 7px 18px;
          border-radius: 9999px;
          font-family: "Roboto Mono", monospace;
          font-size: 13.5px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #a0a0a2;
          margin-bottom: 16px;
        }
        .section-badge .dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #847dff;
          box-shadow: 0 0 10px #847dff;
        }
        .serif-title {
          font-family: "Newsreader", Georgia, serif;
          font-weight: 300;
          font-size: 64px;
          line-height: 1.1;
          letter-spacing: -0.02em;
          text-align: center;
          color: #f5f5f7;
        }
        .serif-title em {
          font-style: italic;
          color: #ffffff;
        }
        .subhead {
          font-size: 22px;
          color: #a0a0a2;
          text-align: center;
          max-width: 860px;
          margin-top: 14px;
        }
        .agent-grid {
          display: grid;
          grid-template-columns: repeat(3, 460px);
          gap: 30px;
          margin-top: 36px;
        }
        .agent-card {
          background: #161718;
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 20px;
          padding: 30px 26px;
          display: flex;
          flex-direction: column;
          gap: 18px;
          position: relative;
          overflow: hidden;
        }
        .agent-card::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: var(--card-accent, #847dff);
          box-shadow: 0 0 14px var(--card-accent, #847dff);
        }
        .agent-header {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .agent-avatar {
          width: 50px;
          height: 50px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 20px;
          color: #0b0b0c;
          background: var(--card-accent, #847dff);
        }
        .agent-info h4 {
          font-size: 20px;
          font-weight: 600;
          color: #f5f5f7;
        }
        .agent-info span {
          font-family: "Roboto Mono", monospace;
          font-size: 13px;
          color: #c0c0c5;
        }
        .claim-banner {
          background: #1f2021;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 12px;
          padding: 14px 16px;
          font-family: "Roboto Mono", monospace;
          font-size: 13px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .atomic-lock-pill {
          background: rgba(16, 185, 129, 0.15);
          border: 1px solid #10b981;
          color: #10b981;
          padding: 4px 10px;
          border-radius: 6px;
          font-weight: 600;
          font-size: 11.5px;
        }
        .branch-pill {
          padding: 6px 12px;
          background: rgba(255, 255, 255, 0.04);
          border-radius: 8px;
          font-family: "Roboto Mono", monospace;
          font-size: 12px;
          color: #90b8f0;
        }
      </style>

      <div id="root" data-composition-id="frame-02" data-width="1920" data-height="1080">
        <div class="section-badge"><span class="dot"></span>Multi-Agent Architecture</div>
        <h2 class="serif-title">
          One tool or many. <em>Never a collision.</em>
        </h2>
        <p class="subhead">Each agent pulls its own tasks on an isolated git branch prefix.</p>

        <div class="agent-grid">
          <!-- Nova (Claude Code) -->
          <div id="f2-agent-1" class="agent-card" style="--card-accent: #847dff;">
            <div class="agent-header">
              <div class="agent-avatar">N</div>
              <div class="agent-info">
                <h4>Nova</h4>
                <span>Claude Code · assign-nova</span>
              </div>
            </div>
            <div class="claim-banner">
              <span>claim_task(ASG-42)</span>
              <span id="f2-lock" class="atomic-lock-pill" style="opacity: 0;">✓ ATOMIC CLAIM</span>
            </div>
            <div id="f2-branch" class="branch-pill" style="opacity: 0;">
              branch: nova/asg-42-rate-limit
            </div>
          </div>

          <!-- Atlas (Cursor) -->
          <div id="f2-agent-2" class="agent-card" style="--card-accent: #00b3dd;">
            <div class="agent-header">
              <div class="agent-avatar">A</div>
              <div class="agent-info">
                <h4>Atlas</h4>
                <span>Cursor · assign-atlas</span>
              </div>
            </div>
            <div class="claim-banner">
              <span>checking ASG-42...</span>
            </div>
            <div class="branch-pill" style="color: #c0c0c5;">
              status: yielded to @nova
            </div>
          </div>

          <!-- Sable (Codex) -->
          <div id="f2-agent-3" class="agent-card" style="--card-accent: #dd90d8;">
            <div class="agent-header">
              <div class="agent-avatar">S</div>
              <div class="agent-info">
                <h4>Sable</h4>
                <span>Codex · assign-sable</span>
              </div>
            </div>
            <div class="claim-banner">
              <span>ready for next task</span>
            </div>
            <div class="branch-pill" style="color: #c0c0c5;">
              status: standing by
            </div>
          </div>
        </div>

        <div style="margin-top: 36px; display: flex; gap: 30px;">
          <div class="section-badge" style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.4); color: #10b981;">
            <span class="dot" style="background: #10b981; box-shadow: 0 0 10px #10b981;"></span>
            100% Compare-and-Swap Atomic Lock
          </div>
          <div class="section-badge">
            <span class="dot"></span>0 Merge Conflicts Guaranteed
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#f2-agent-1", 
          { y: 50, opacity: 0 }, 
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 
          0.1
        );
        tl.fromTo("#f2-agent-2", 
          { y: 50, opacity: 0 }, 
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 
          0.3
        );
        tl.fromTo("#f2-agent-3", 
          { y: 50, opacity: 0 }, 
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 
          0.5
        );
        // Atomic lock pop
        tl.fromTo("#f2-lock", 
          { scale: 0, opacity: 0 }, 
          { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 
          1.8
        );
        tl.fromTo("#f2-branch", 
          { x: -15, opacity: 0 }, 
          { x: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 
          2.2
        );
        // Dim other agents
        tl.to("#f2-agent-2, #f2-agent-3", 
          { opacity: 0.6, duration: 0.4 }, 
          2.3
        );
        window.__timelines["frame-02"] = tl;
      </script>
    </template>
  </body>
</html>
